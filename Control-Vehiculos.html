<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>App Vehículos · Control de Vehículos Eléctricos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --ink:#AD0538; --ink-2:#8A032C;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F5; --field-bg:#DCDDDF;
  --border:#CACBCD; --text:#24272B; --text-muted:#5B6169;
  --accent:#AD0538; --accent-ink:#7A0227; --accent-bg:#F7E1E7;
  --good:#3F7D58; --good-bg:#E4EFE7;
  --warn:#B8862E; --warn-bg:#F5EAD3;
  --danger:#B23A3A; --danger-bg:#F5E0DE;
  --shadow: 0 1px 2px rgba(173,5,56,.10), 0 5px 18px rgba(173,5,56,.14);
  --radius: 10px;
  --font-display: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --font-ui: "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono: ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
.tabular{font-variant-numeric:tabular-nums; font-family:var(--font-mono);}
button{font-family:inherit;}
a{color:inherit;}

.shell{display:flex; flex-direction:column; min-height:100vh;}
.rail{ width:100%; background:var(--bg); display:flex; padding:16px 22px; position:sticky; top:0; z-index:6; }
.rail-box{ width:100%; background:#fff; border:1px solid var(--accent-bg); border-radius:18px; box-shadow:var(--shadow); display:flex; flex-direction:row; align-items:center; flex-wrap:wrap; padding:12px 18px; gap:8px 10px; }
.brand{background:var(--accent); color:#fff; padding:7px 14px 7px 7px; border-radius:12px; display:flex; align-items:center; gap:11px; margin-right:6px;}
.nav-rows{display:flex; flex-direction:column; gap:8px; flex:1; min-width:0;}
.nav-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px;}
.brand-text{display:flex; flex-direction:column; gap:2px; line-height:1.2;}
.brand .app-name{font-family:var(--font-display); font-size:16.5px; font-weight:600; color:#fff; letter-spacing:.01em; white-space:nowrap;}
.brand .sub{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:#fff; opacity:.82; font-weight:400; text-align:left; white-space:nowrap;}
.brand .logo-box{background:#fff; border-radius:8px; padding:8px 12px; display:inline-flex; align-items:center;}
.brand .logo-img{display:block; width:auto; height:34px; max-width:none;}
.navbtn{ display:flex; align-items:center; gap:8px; text-align:left; width:auto; background:var(--accent); border:0; color:#fff; font-weight:600; padding:9px 24px; border-radius:8px; font-size:12.5px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.15); transition:background .12s ease, color .12s ease, transform .12s ease; white-space:nowrap; }
.navbtn:hover{background:var(--accent-ink); color:#fff; transform:translateY(-1px);}
.navbtn.navbtn-white{background:var(--accent); color:#fff;}
.navbtn.active{background:#fff; color:var(--accent); border:1px solid var(--accent); box-shadow:0 1px 3px rgba(173,5,56,.25);}
.navbtn.active:hover{background:#fff; color:var(--accent);}
.navbtn .ic{width:15px; text-align:center; font-family:var(--font-mono); font-size:11.5px; opacity:.9;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:9px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
.topbar h1{font-size:17px;}
.topbar .meta{font-size:12px; color:var(--text-muted);}
.content{padding:26px 28px 60px; max-width:1180px; width:100%; margin:0 auto;}

.btn{ display:inline-flex; align-items:center; gap:6px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 14px; font-size:13.5px; cursor:pointer; transition:border-color .12s ease, background .12s ease; }
.btn:hover{border-color:var(--accent);}
.btn:focus-visible, .navbtn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--accent-bg); border-radius:var(--radius); box-shadow:var(--shadow);}
.grid-kpi{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px;}
.typebar-row{display:grid; grid-template-columns:160px 1fr 30px; align-items:center; gap:10px; padding:5px 0;}
.typebar-row + .typebar-row{border-top:1px solid var(--accent-bg);}
.typebar-label{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text);}
.typebar-icon{font-size:16px; line-height:1;}
.typebar-track{background:var(--field-bg); border-radius:99px; height:9px; overflow:hidden;}
.typebar-fill{background:var(--accent); height:100%; border-radius:99px; transition:width .35s ease;}
.typebar-count{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; text-align:right; color:var(--accent-ink);}
.freqbar-row{display:grid; grid-template-columns:1fr 1fr 30px; align-items:center; gap:10px; padding:7px 6px; border-radius:8px; cursor:pointer; transition:background .12s ease;}
.freqbar-row:hover{background:var(--surface-2);}
.freqbar-row.freqbar-selected{background:var(--accent-bg);}
.freqbar-row.freqbar-selected .typebar-fill{background:var(--accent-ink);}
.freqbar-meta{font-size:10px; color:var(--text-muted); font-weight:400;}
.kpi{padding:7px 9px;}
.card.kpi, .card-muted{background:var(--field-bg);}
.kpi .label{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
.kpi .value{font-family:var(--font-display); font-size:16px; margin-top:1px;}
.kpi .foot{font-size:9.5px; color:var(--text-muted); margin-top:1px;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; letter-spacing:.02em;}
.pill::before{content:""; width:6px; height:6px; border-radius:99px; background:currentColor;}
.pill-ok{background:var(--good-bg); color:var(--good);}
.pill-warn{background:var(--warn-bg); color:var(--warn);}
.pill-danger{background:var(--danger-bg); color:var(--danger);}
.pill-muted{background:var(--surface-2); color:var(--text-muted);}

.code{font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:2px 6px; white-space:nowrap;}

label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px;}
input[type=text],input[type=date],input[type=time],input[type=search],input[type=tel],input[type=email],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--field-bg); color:var(--text); font-size:13.5px; font-family:inherit;
}
.field{margin-bottom:13px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:8px 9px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:8px 9px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.tablewrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--accent-bg); box-shadow:var(--shadow);}
.tablewrap table{min-width:680px;}

.empty{padding:48px 24px; text-align:center; color:var(--text-muted);}
.empty h3{color:var(--text); font-size:18px; margin-bottom:6px;}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 8px; flex-wrap:wrap; gap:8px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:16px;}
.section-head .hint{font-size:12px; color:var(--text-muted);}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.toolbar input,.toolbar select{width:auto;}
.toolbar .search{flex:1; min-width:180px;}

.overlay{position:fixed; inset:0; background:rgba(15,20,25,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50;}
.modal{background:var(--surface); border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow); width:100%; max-width:560px; padding:22px 24px;}
.modal h3{font-size:17px; margin-bottom:14px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.chip-list{display:flex; flex-wrap:wrap; gap:8px;}
.chip{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12.5px;}
.chip b{display:block; font-family:var(--font-display); font-size:15px;}
.chip-click{cursor:pointer; transition:border-color .12s ease, background .12s ease;}
.chip-click:hover{border-color:var(--accent);}
.chip-selected{background:var(--accent-bg); border-color:var(--accent);}

.bars{display:flex; align-items:flex-end; gap:5px; height:104px; padding-top:16px;}
.bars .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
.bars .b{width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; opacity:.85;}
.bars .lbl{font-size:9.5px; color:var(--text-muted); white-space:nowrap;}
.bars .cnt{font-size:10.5px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; font-family:var(--font-mono); line-height:1;}
.bars .cnt.zero{color:var(--text-muted); font-weight:400; opacity:.5;}

.seg{display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-bottom:14px;}
.seg-btn{border:0; background:var(--surface); color:var(--text-muted); padding:8px 18px; font-size:13.5px; cursor:pointer; font-weight:600;}
.seg-btn:not(:last-child){border-right:1px solid var(--border);}
.seg-btn.active{background:var(--accent); color:#fff;}

.helpbar{font-size:12px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:16px;}
.banner{font-size:12.5px; padding:9px 14px; border-radius:8px; margin-bottom:16px; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-bg);}
.banner.ok{background:var(--good-bg); color:var(--good); border-color:var(--good-bg);}
.banner.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-bg);}

.toast-wrap{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:8px; padding:11px 14px; font-size:12.5px; box-shadow:var(--shadow); animation:toastIn .15s ease;}
.toast.toast-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

.clock{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; display:inline-block;}

.photo-box{background:var(--field-bg); border:1px dashed var(--border); border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; aspect-ratio:1/1;}
.photo-box img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-box .ph{color:var(--text-muted); font-size:12px; text-align:center; padding:10px;}
.lookup-grid{display:grid; grid-template-columns:120px 120px 1fr; gap:16px; align-items:start;}

.credencial{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:28px 26px 24px; }
.credencial .banda{ height:8px; width:100%; background:var(--accent); border-radius:8px 8px 0 0; margin:-22px -24px 22px; }
.credencial .foto{ width:112px; height:112px; border-radius:50%; overflow:hidden; border:3px solid var(--accent-bg); background:var(--field-bg); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.credencial .foto img{ width:100%; height:100%; object-fit:cover; display:block; }
.credencial .foto .ph{ font-size:11px; color:var(--text-muted); padding:6px; }
.credencial .nombre{ font-family:var(--font-display); font-size:20px; margin-bottom:4px; }
.credencial .doc{ font-family:var(--font-mono); font-size:13px; color:var(--text-muted); margin-bottom:14px; }
.credencial .datos{ display:flex; flex-direction:column; gap:4px; margin-bottom:20px; font-size:12.5px; color:var(--text-muted); }
.credencial .qrbox{ display:inline-block; padding:12px; background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }

@media (max-width:1180px) and (min-width:861px){ .content{padding:20px 16px 60px; max-width:100%;} }
@media (max-width:860px){
  .rail{padding:10px 12px;}
  .brand .sub{display:none;}
  .grid-kpi{grid-template-columns:1fr 1fr;}
  .row2,.row3{grid-template-columns:1fr;}
  .lookup-grid{grid-template-columns:1fr 1fr; grid-template-areas:"a b" "c c";}
  .content{padding:18px;}
  .topbar{padding:8px 16px;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>

function lsSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function uid(){ return 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nextFolio(){
  var counter = lsGet(LS_COUNTER, {year:new Date().getFullYear(), seq:0});
  var year = new Date().getFullYear();
  if(counter.year !== year){ counter.year = year; counter.seq = 0; }
  counter.seq += 1;
  lsSet(LS_COUNTER, counter);
  return 'VEH-'+year+'-'+String(counter.seq).padStart(4,'0');
}

/* ---------- helpers ---------- */
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function nowHM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return '—'; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tc(s){ return (s||'').trim(); }
var TIPO_LABELS = { bicicleta:'Bicicleta', patineta:'Patineta eléctrica', moto:'Moto eléctrica', motocicleta:'Motocicleta' };
var TIPO_ICONS = { bicicleta:'🚲', patineta:'🛴', moto:'🛵', motocicleta:'🏍️' };

function propietarioById(id){ return state.propietarios.find(function(p){ return p.id===id; }) || null; }
function vehiculoById(id){ return state.vehiculos.find(function(v){ return v.id===id; }) || null; }
function turnoById(id){ return state.turnos.find(function(t){ return t.id===id; }) || null; }
function turnoDeVehiculo(v){
  var p = propietarioById(v.propietarioId);
  return (p && p.turnoId) ? turnoById(p.turnoId) : null;
}
/* El turno se define por duración en horas (no por horario fijo), para no tener que
   reprogramar horarios cada semana: el fin esperado = hora real de ingreso + duración del turno. */
function finTurnoEsperado(movimiento, turno){
  var ingreso = new Date(movimiento.fechaIngreso+'T'+movimiento.horaIngreso+':00');
  return new Date(ingreso.getTime() + turno.horas*3600000);
}
function movimientoAbierto(vehiculoId){
  return state.movimientos.find(function(m){ return m.vehiculoId===vehiculoId && !m.horaSalida; }) || null;
}
function ultimoMovimiento(vehiculoId){
  var lista = state.movimientos.filter(function(m){ return m.vehiculoId===vehiculoId; });
  if(!lista.length) return null;
  return lista.reduce(function(a,b){ return (b.fechaIngreso+b.horaIngreso) > (a.fechaIngreso+a.horaIngreso) ? b : a; });
}
function horasTranscurridas(fechaISO, horaHM){
  var ts = new Date(fechaISO+'T'+horaHM+':00');
  return (Date.now() - ts.getTime()) / 3600000;
}
function estadoVehiculo(v){
  var abierto = movimientoAbierto(v.id);
  if(!abierto) return 'fuera';
  var h = horasTranscurridas(abierto.fechaIngreso, abierto.horaIngreso);
  var cfg = getConfig();
  var abandonoGenerico = h >= cfg.abandono;
  var abandonoTurno = false;
  var turno = turnoDeVehiculo(v);
  if(turno){
    var horasDesdeFin = (Date.now() - finTurnoEsperado(abierto, turno).getTime()) / 3600000;
    abandonoTurno = horasDesdeFin >= cfg.abandonoTurno;
  }
  if(abandonoGenerico || abandonoTurno) return 'abandono';
  if(h >= cfg.permanencia) return 'permanencia';
  return 'dentro';
}
function motivoAbandono(v){
  var abierto = movimientoAbierto(v.id);
  if(!abierto) return '';
  var cfg = getConfig();
  var h = horasTranscurridas(abierto.fechaIngreso, abierto.horaIngreso);
  var motivos = [];
  if(h >= cfg.abandono) motivos.push('supera '+cfg.abandono+'h desde el ingreso');
  var turno = turnoDeVehiculo(v);
  if(turno){
    var horasDesdeFin = (Date.now() - finTurnoEsperado(abierto, turno).getTime()) / 3600000;
    if(horasDesdeFin >= cfg.abandonoTurno) motivos.push('turno "'+turno.nombre+'" ('+turno.horas+'h) terminó hace '+(Math.round(horasDesdeFin*10)/10)+'h');
  }
  return motivos.join(' · ');
}
function estadoPill(st){
  var map = { dentro:['Dentro','pill-ok'], fuera:['Fuera','pill-muted'], permanencia:['Alerta: permanencia','pill-warn'], abandono:['Alerta: abandono','pill-danger'] };
  var m = map[st] || [st,'pill-muted'];
  return '<span class="pill '+m[1]+'">'+m[0]+'</span>';
}
function showToast(msg, type){
  var wrap = document.getElementById('toastWrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.id='toastWrap'; wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  var t = document.createElement('div');
  t.className = 'toast'+(type==='danger' ? ' toast-danger' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ t.remove(); }, 8000);
}

    return;
  }
  root.innerHTML =

      '<h3>PIN administrativo</h3>'+
      '<div class="foot" style="color:var(--text-muted); font-size:12.5px; margin-bottom:14px;">'+esc(mensaje)+'</div>'+

  document.getElementById('ov').addEventListener('click', function(ev){ if(ev.target.id==='ov') root.innerHTML=''; });

      '</div>'+

  document.getElementById('cancelBtn').addEventListener('click', function(){ root.innerHTML=''; });
  document.getElementById('ov').addEventListener('click', function(ev){ if(ev.target.id==='ov') root.innerHTML=''; });
  document.getElementById('okBtn').addEventListener('click', function(){
    var nombre = tc(document.getElementById('f-turnoNombre').value);
    var horas = parseFloat(document.getElementById('f-turnoHoras').value);

/* Promedio de vehículos presentes por día de la semana, calculado a partir de los ingresos/salidas
   reales de las últimas semanas (no de reglas fijas de turno), para detectar picos de ocupación. */
var PICOS_SEMANAS = 8;
var PICOS_DIAS_NOMBRE = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function picosAsistenciaPorDia(filterField, filterKey){
  var lookbackDias = PICOS_SEMANAS*7;
  var sum = [0,0,0,0,0,0,0], cuenta = [0,0,0,0,0,0,0];
  for(var i=0;i<lookbackDias;i++){
    var d = new Date(Date.now() - i*86400000);
    var iso = d.toISOString().slice(0,10);
    var presentes = state.movimientos.filter(function(m){
      if(m.fechaIngreso>iso || (m.fechaSalida && m.fechaSalida<iso)) return false;
      if(!filterField) return true;
      var v = vehiculoById(m.vehiculoId); if(!v) return false;
      if(filterField==='tipo') return v.tipo===filterKey;
      var p = propietarioById(v.propietarioId);
      return (p ? (tc(p.area)||'Sin área') : 'Sin área') === filterKey;
    }).length;
    var dow = d.getDay();
    sum[dow] += presentes; cuenta[dow]++;
  }
  var orden = [1,2,3,4,5,6,0]; // lunes..domingo
  return orden.map(function(dow){
    var avg = cuenta[dow] ? sum[dow]/cuenta[dow] : 0;
    return { key:String(dow), name:PICOS_DIAS_NOMBRE[dow], avg: Math.round(avg*10)/10 };
  });
}
function picosBarsHTML(picos){
  var max = Math.max(1, picos.reduce(function(m,x){ return Math.max(m,x.avg); }, 0));
  return '<div class="bars">'+ picos.map(function(x){
    var h = Math.round((x.avg/max)*80)+2;
    return '<div class="col"><div class="cnt'+(x.avg?'':' zero')+'">'+x.avg+'</div><div class="b" style="height:'+h+'px" title="'+x.avg+' vehículo(s) en promedio los '+x.name+'"></div><div class="lbl">'+x.name+'</div></div>';
  }).join('') +'</div>';
}

function fileToDataUrlCompressed(file, maxDim, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function playAlertSound(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.55);
    setTimeout(function(){
      var o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.type='sine'; o2.frequency.value=880; o2.connect(g2); g2.connect(ctx.destination);
      g2.gain.setValueAtTime(0.0001, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
      o2.start(); o2.stop(ctx.currentTime+0.55);
    }, 650);
  }catch(e){}
}

var alertedKeys = {};
var selectedStatField = null, selectedStatKey = null;
function freqListTipo(movs){
  var m = {};
  movs.forEach(function(mv){
    var v = vehiculoById(mv.vehiculoId); if(!v) return;
    var t = v.tipo;
    if(!m[t]) m[t] = {count:0, last:null};
    m[t].count++; if(!m[t].last || mv.fechaIngreso>m[t].last) m[t].last = mv.fechaIngreso;
  });
  return Object.keys(m).map(function(k){ return {key:k, name:TIPO_LABELS[k]||k, count:m[k].count, last:m[k].last}; })
    .sort(function(a,b){ return b.count-a.count; });
}
function freqListDepto(movs){
  var m = {};
  movs.forEach(function(mv){
    var v = vehiculoById(mv.vehiculoId); if(!v) return;
    var p = propietarioById(v.propietarioId); if(!p) return;
    var d = tc(p.area) || 'Sin área';
    if(!m[d]) m[d] = {count:0, last:null};
    m[d].count++; if(!m[d].last || mv.fechaIngreso>m[d].last) m[d].last = mv.fechaIngreso;
  });
  return Object.keys(m).map(function(k){ return {key:k, name:k, count:m[k].count, last:m[k].last}; })
    .sort(function(a,b){ return b.count-a.count; });
}
function freqBarsHTML(list, field, iconMap){
  var max = list.reduce(function(m,x){ return Math.max(m,x.count); }, 1);

    var sel = selectedStatField===field && selectedStatKey===x.key;
    var icon = iconMap ? (iconMap[x.key]||'') : '';
    return '<div class="freqbar-row'+(sel?' freqbar-selected':'')+'" data-key="'+esc(x.key)+'" data-field="'+field+'">'+

function registrarIngreso(vehiculoId){
  if(movimientoAbierto(vehiculoId)) return;
  state.movimientos.push({ id: uid(), vehiculoId: vehiculoId, fechaIngreso: todayISO(), horaIngreso: nowHM(), fechaSalida:'', horaSalida:'', registradoPor:'' });
  saveMov();
}
function registrarSalida(vehiculoId){
  var m = movimientoAbierto(vehiculoId);
  if(!m) return null;
  m.fechaSalida = todayISO(); m.horaSalida = nowHM();
  var v = vehiculoById(vehiculoId);
  var turno = v ? turnoDeVehiculo(v) : null;
  var anticipada = false, horasAnt = 0;
  if(turno){
    var diffH = (finTurnoEsperado(m, turno).getTime() - Date.now()) / 3600000;
    var cfg = getConfig();
    if(diffH >= cfg.anticipacion){ anticipada = true; horasAnt = Math.round(diffH*10)/10; }
  }
  m.salidaAnticipada = anticipada;
  m.horasAnticipada = horasAnt;
  saveMov();
  var key1 = vehiculoId+'-permanencia', key2 = vehiculoId+'-abandono';
  delete alertedKeys[key1]; delete alertedKeys[key2];
  if(anticipada){
    var p = v ? propietarioById(v.propietarioId) : null;
    playAlertSound();
    showToast('⚠ Salida anticipada: '+(p?p.nombre:(v?v.folio:''))+' salió '+horasAnt+' h antes del fin de su turno ('+turno.nombre+').', 'warn');
  }
  return { anticipada: anticipada, horasAnticipada: horasAnt, turno: turno };
}

/* ================= CARGA MASIVA CSV ================= */
var CSV_ALIASES = {
  documento: ['documento','cedula','identificacion','documento_identidad','dni','numero_documento'],
  nombre: ['nombre','propietario','nombre_propietario','empleado','nombre_completo'],
  area: ['area','departamento','area_departamento','dependencia'],
  celular: ['celular','telefono','numero_celular','movil','numero_telefono'],
  correo: ['correo','email','correo_electronico','mail'],
  tipo: ['tipo','tipo_transporte','tipo_vehiculo','medio_transporte']
};
var CSV_TIPO_ALIASES = {
  bicicleta:'bicicleta', bici:'bicicleta', bicicleta_electrica:'bicicleta',
  patineta:'patineta', patineta_electrica:'patineta', scooter:'patineta', monopatin:'patineta',
  moto:'moto', moto_electrica:'moto', motoelectrica:'moto',
  motocicleta:'motocicleta', moto_gasolina:'motocicleta', motocicleta_gasolina:'motocicleta', moto_combustion:'motocicleta'
};
function normalizarTextoCSV(s){
  s = (s==null?'':String(s)).trim().toLowerCase();
  s = s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g,'') : s;
  return s.split(/\s+/).join('_').split('-').join('_');
}
function normalizarTipoCSV(v){ return CSV_TIPO_ALIASES[normalizarTextoCSV(v)] || null; }
function detectarDelimitadorCSV(text){
  var primera = (text.split(/\r?\n/)[0]||'');
  var comas = (primera.match(/,/g)||[]).length;
  var puntoYComa = (primera.match(/;/g)||[]).length;
  return puntoYComa > comas ? ';' : ',';
}
function parseCSVtexto(text, delim){
  var rows = [], row = [], field = '', inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else if(c==='"'){ inQuotes = true; }
    else if(c===delim){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c==='\r'){ /* ignorar */ }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(f){ return f.trim()!==''; }); });
}
function mapearColumnasCSV(headerRow){
  var normalizados = headerRow.map(normalizarTextoCSV);
  var mapa = {};
  Object.keys(CSV_ALIASES).forEach(function(campo){
    var alias = CSV_ALIASES[campo];
    for(var i=0;i<normalizados.length;i++){ if(alias.indexOf(normalizados[i])>=0){ mapa[campo]=i; break; } }
  });
  return mapa;
}
var csvPendientes = [];
function procesarCSV(text){
  var delim = detectarDelimitadorCSV(text);
  var filas = parseCSVtexto(text, delim);
  var cont = document.getElementById('csvPreview');
  if(filas.length < 2){ alert('El archivo CSV no tiene datos.'); return; }
  var mapa = mapearColumnasCSV(filas[0]);
  if(mapa.nombre===undefined || mapa.documento===undefined){
    alert('No se pudieron identificar las columnas de nombre/documento. Revisa los encabezados o usa la plantilla.');
    return;
  }
  var validos = [], errores = [];
  filas.slice(1).forEach(function(fila, i){
    var nFila = i+2;
    function get(campo){ var idx = mapa[campo]; return (idx!==undefined && fila[idx]!==undefined) ? tc(fila[idx]) : ''; }
    var nombre = get('nombre'), documento = get('documento');
    if(!nombre || !documento){ errores.push('Fila '+nFila+': falta nombre o documento, se omitió.'); return; }
    var tipoTexto = get('tipo');
    var tipo = normalizarTipoCSV(tipoTexto) || 'bicicleta';
    if(tipoTexto && !normalizarTipoCSV(tipoTexto)){ errores.push('Fila '+nFila+': tipo "'+tipoTexto+'" no reconocido, se asignó Bicicleta.'); }
    var existenteVeh = state.vehiculos.find(function(v){
      var p = propietarioById(v.propietarioId);
      return p && p.documento===documento && v.tipo===tipo;
    });
    validos.push({
      documento: documento, nombre: nombre, area: get('area'), celular: get('celular'),
      correo: get('correo'), tipo: tipo, actualiza: !!existenteVeh, vehiculoId: existenteVeh ? existenteVeh.id : null
    });
  });
  csvPendientes = validos;
  mostrarPreviewCSV(validos, errores);
}
function mostrarPreviewCSV(validos, errores){
  var cont = document.getElementById('csvPreview');
  var nuevos = validos.filter(function(v){ return !v.actualiza; }).length;
  var actualizados = validos.length - nuevos;
  var filasTabla = validos.slice(0,10).map(function(v){
    return '<tr><td>'+esc(v.nombre)+'</td><td>'+esc(v.documento)+'</td><td>'+esc(TIPO_LABELS[v.tipo])+'</td><td>'+esc(v.area||'—')+'</td><td>'+(v.actualiza?'Actualiza':'Nuevo')+'</td></tr>';
  }).join('');
  var erroresHtml = errores.length ? ('<div class="banner warn"><b>'+errores.length+' observación(es):</b><ul style="margin:6px 0 0; padding-left:18px;">'+errores.slice(0,20).map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul></div>') : '';
  cont.innerHTML =
    '<div class="card" style="padding:16px 18px; background:var(--surface-2);">'+
      '<p style="margin:0 0 10px;"><b>'+validos.length+'</b> fila(s) lista(s) para importar ('+nuevos+' nueva(s), '+actualizados+' actualización(es)).</p>'+
      erroresHtml +
      (validos.length ? ('<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Documento</th><th>Tipo</th><th>Área</th><th>Acción</th></tr></thead><tbody>'+filasTabla+'</tbody></table></div>'+(validos.length>10?'<p class="foot" style="color:var(--text-muted); font-size:12px; margin-top:6px;">Mostrando 10 de '+validos.length+'.</p>':'')) : '')+
      '<div style="display:flex; gap:10px; margin-top:12px;">'+
        '<button class="btn btn-primary" id="btnConfirmarCSV" '+(validos.length?'':'disabled')+'>✓ Confirmar importación ('+validos.length+')</button>'+
        '<button class="btn" id="btnCancelarCSV">Cancelar</button>'+
      '</div>'+
    '</div>';
  document.getElementById('btnConfirmarCSV').addEventListener('click', function(){
    csvPendientes.forEach(function(row){
      var p = state.propietarios.find(function(x){ return x.documento===row.documento; });
      if(p){ p.nombre=row.nombre; p.area=row.area; p.celular=row.celular; p.correo=row.correo; }
      else { p = { id: uid(), documento: row.documento, nombre: row.nombre, area: row.area, celular: row.celular, correo: row.correo, fotoPropietario: '' }; state.propietarios.push(p); }
      if(row.actualiza && row.vehiculoId){
        var v = vehiculoById(row.vehiculoId); if(v) v.propietarioId = p.id;
      } else {
        state.vehiculos.push({ id: uid(), folio: nextFolio(), tipo: row.tipo, propietarioId: p.id, fotoVehiculo: '' });
      }
    });
    saveProp(); saveVeh();
    csvPendientes = [];
    document.getElementById('csvPreview').innerHTML = '<div class="banner ok">'+validos.length+' vehículo(s) importado(s) correctamente.</div>';
    refreshTopMeta();
  });
  document.getElementById('btnCancelarCSV').addEventListener('click', function(){ csvPendientes=[]; cont.innerHTML=''; });
}

    }).join('');

    tb.querySelectorAll('[data-ingreso]').forEach(function(btn){ btn.addEventListener('click', function(){ registrarIngreso(btn.dataset.ingreso); drawMovRows(); refreshTopMeta(); }); });
  }

    '</tbody></table></div>'+

    '<div class="section-head"><h2>Salidas anticipadas del mes</h2><span class="hint">salieron antes del fin de su turno asignado</span></div>'+
    '<div class="card" style="padding:6px 0; margin-bottom:22px;"><div class="tablewrap" style="border:0;"><table><thead><tr><th>Propietario</th><th>Área</th><th>Folio</th><th>Turno</th><th>Fecha</th><th>Salió</th><th>Horas antes</th></tr></thead><tbody>'+
      (anticipadas.length ? anticipadas.map(function(x){
        return '<tr><td>'+esc(x.p.nombre)+'</td><td>'+esc(x.p.area||'—')+'</td><td><span class="code">'+esc(x.v?x.v.folio:'—')+'</span></td><td>'+esc(x.turno?x.turno.nombre:'—')+'</td>'+
          '<td class="tabular">'+fmtDate(x.m.fechaSalida)+'</td><td class="tabular">'+x.m.horaSalida+'</td><td class="tabular">'+x.m.horasAnticipada+' h</td></tr>';
      }).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:28px;">Sin salidas anticipadas registradas en este mes.</td></tr>') +
    '</tbody></table></div></div>';

  document.getElementById('f-mes').addEventListener('change', function(e){ reporteMes = e.target.value; renderReporte(); });
  document.getElementById('btnDescargarReporte').addEventListener('click', function(){
    var lines = [['#','Propietario','Documento','Area','Ingresos'].join(',')];
    ranking.forEach(function(x,i){ lines.push([i+1, x.p.nombre, x.p.documento, x.p.area, x.count].map(csvEscape).join(',')); });
    lines.push('');
    lines.push(['Propietario','Documento','Area','Folio','Turno','Fecha','Hora salida','Horas anticipadas'].join(','));
    anticipadas.forEach(function(x){
      lines.push([x.p.nombre, x.p.documento, x.p.area, x.v?x.v.folio:'', x.turno?x.turno.nombre:'', x.m.fechaSalida, x.m.horaSalida, x.m.horasAnticipada].map(csvEscape).join(','));
    });
    downloadFile('reporte_uso_'+reporteMes+'.csv', 'text/csv', '﻿'+lines.join('\r\n'));
  });
}
function mergeById(existentes, entrantes){
  var byId = {}; existentes.forEach(function(x){ byId[x.id]=x; });
  entrantes.forEach(function(x){ byId[x.id] = x; });
  return Object.keys(byId).map(function(k){ return byId[k]; });
}
function csvEscape(v){ v = v==null?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadFile(filename, mime, content){
  var blob = new Blob([content], {type: mime + ';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ================= DATOS Y RESPALDO ================= */
function renderDatos(){
  refreshTopMeta();
  var el = document.getElementById('content');
  if(!isAdmin()){
    el.innerHTML = '<div class="card empty"><h3>Acceso restringido</h3><p>Esta sección es solo para el modo administrador.</p>'+
      '<div style="margin-top:14px;"><button class="btn btn-primary" id="btnGoAdmin">🔒 Activar modo administrador</button></div></div>';
    document.getElementById('btnGoAdmin').addEventListener('click', function(){ document.getElementById('btnAdminToggle').click(); });
    return;
  }
  el.innerHTML =
    '<div class="row2" style="align-items:start;">'+
      '<div class="card" style="padding:20px 22px;">'+
        '<h3 style="font-size:15px; margin-bottom:8px;">Exportar</h3>'+
        '<p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Respaldo completo (propietarios, vehículos y movimientos, incluye fotos).</p>'+
        '<button class="btn btn-primary" id="btnExportJson">Respaldo completo (JSON)</button>'+
        '<div id="exportMsg" style="font-size:12.5px; color:var(--text-muted); margin-top:10px;"></div>'+
      '</div>'+
      '<div class="card" style="padding:20px 22px;">'+
        '<h3 style="font-size:15px; margin-bottom:8px;">Importar</h3>'+
        '<p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Carga un respaldo JSON. Se agrega a lo ya existente.</p>'+
        '<input type="file" id="fileInput" accept=".json,application/json" />'+
        '<div id="importMsg" style="font-size:12.5px; color:var(--text-muted); margin-top:10px;"></div>'+
      '</div>'+
    '</div>'+
    '<div class="section-head"><h2>Turnos laborales</h2><span class="hint">se definen por duración en horas; el fin de jornada de cada persona se calcula desde su hora real de ingreso, no por horario fijo</span></div>'+
    '<div class="card" style="padding:18px 22px; margin-bottom:22px;">'+
      (state.turnos.length ? (
        '<div class="tablewrap" style="margin-bottom:12px;"><table><thead><tr><th>Nombre</th><th>Duración</th><th>Empleados</th><th></th></tr></thead><tbody>'+
        state.turnos.map(function(t){
          var n = state.propietarios.filter(function(p){ return p.turnoId===t.id; }).length;
          return '<tr><td>'+esc(t.nombre)+'</td><td class="tabular">'+t.horas+' h</td><td class="tabular">'+n+'</td>'+
            '<td style="white-space:nowrap;"><button class="btn btn-sm btn-ghost" data-edit-turno="'+t.id+'">Editar</button> <button class="btn btn-sm btn-ghost" data-del-turno="'+t.id+'" style="color:var(--danger);">Eliminar</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      ) : '<p style="color:var(--text-muted); font-size:13px; margin:0 0 12px;">Aún no hay turnos creados.</p>') +
      '<button class="btn btn-primary" id="btnNuevoTurno">+ Agregar turno</button>'+
    '</div>'+
    '<div class="section-head"><h2>Umbrales de alerta</h2><span class="hint">se guardan en el respaldo JSON y se aplican también en la app móvil al importarlo</span></div>'+
    '<div class="card" style="padding:18px 22px; margin-bottom:22px;">'+
      '<div class="row2">'+
        field('Horas para alerta de permanencia (genérico)','cfgPermanencia','text', String(getConfig().permanencia)) +
        field('Horas para alerta de abandono (genérico, sin turno)','cfgAbandono','text', String(getConfig().abandono)) +
      '</div>'+
      '<div class="row2">'+
        field('Horas antes del fin de turno para alertar salida anticipada','cfgAnticipacion','text', String(getConfig().anticipacion)) +
        field('Horas después del fin de turno para declarar abandono','cfgAbandonoTurno','text', String(getConfig().abandonoTurno)) +
      '</div>'+
      '<button class="btn btn-primary" id="btnGuardarConfig">Guardar umbrales</button>'+
      '<div id="cfgMsg" style="font-size:12.5px; color:var(--text-muted); margin-top:8px;"></div>'+
    '</div>'+
    '<div class="section-head"><h2>Seguridad</h2></div>'+
    '<div class="card" style="padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px;">'+
      '<div><div style="font-weight:600;">PIN administrativo</div><div style="color:var(--text-muted); font-size:12.5px;">'+(getAdminPin() ? 'Configurado.' : 'No configurado.')+'</div></div>'+
      '<div style="display:flex; gap:8px;">'+
        (getAdminPin() ? '<button class="btn" id="btnQuitarPin" style="border-color:var(--danger-bg); color:var(--danger);">Quitar PIN</button>' : '')+
        '<button class="btn btn-primary" id="btnCambiarPin">'+(getAdminPin()?'Cambiar PIN':'Configurar PIN')+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="section-head"><h2>Zona de riesgo</h2><span class="hint">cada acción es permanente e independiente</span></div>'+
    '<div class="row3">'+
      riskCard('Movimientos', state.movimientos.length+' registro(s)', 'btnWipeMov') +
      riskCard('Vehículos', state.vehiculos.length+' registro(s)', 'btnWipeVeh') +
      riskCard('Propietarios', state.propietarios.length+' registro(s)', 'btnWipeProp') +
    '</div>'+
    '<div class="card" style="padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:14px; border-color:var(--danger);">'+
      '<div><div style="font-weight:600; color:var(--danger);">Borrado completo</div><div style="color:var(--text-muted); font-size:12.5px;">Elimina todo. No se puede deshacer.</div></div>'+
      '<button class="btn btn-primary" id="btnWipeAll" style="background:var(--danger); border-color:var(--danger);">Borrar todo</button>'+
    '</div>';

  document.getElementById('btnGuardarConfig').addEventListener('click', function(){
    var p = parseFloat(document.getElementById('f-cfgPermanencia').value);
    var a = parseFloat(document.getElementById('f-cfgAbandono').value);
    var anticip = parseFloat(document.getElementById('f-cfgAnticipacion').value);
    var abTurno = parseFloat(document.getElementById('f-cfgAbandonoTurno').value);
    if([p,a,anticip,abTurno].some(function(x){ return isNaN(x) || x<=0; })){
      document.getElementById('cfgMsg').textContent = 'Ingresa valores numéricos válidos.'; document.getElementById('cfgMsg').style.color='var(--danger)'; return;
    }
    setConfig({permanencia:p, abandono:a, anticipacion:anticip, abandonoTurno:abTurno});
    document.getElementById('cfgMsg').textContent = 'Umbrales guardados.'; document.getElementById('cfgMsg').style.color='var(--good)';
    rerender();
  });
  var btnNuevoTurno = document.getElementById('btnNuevoTurno');
  if(btnNuevoTurno) btnNuevoTurno.addEventListener('click', function(){ openTurnoModal(null, function(){ renderDatos(); }); });
  document.querySelectorAll('[data-edit-turno]').forEach(function(btn){
    btn.addEventListener('click', function(){ openTurnoModal(turnoById(btn.dataset.editTurno), function(){ renderDatos(); }); });
  });
  document.querySelectorAll('[data-del-turno]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.delTurno;
      var afectados = state.propietarios.filter(function(p){ return p.turnoId===id; }).length;
      var msg = '¿Eliminar este turno?' + (afectados ? ' '+afectados+' empleado(s) quedarán sin turno asignado.' : '');
      if(!confirm(msg)) return;
      state.turnos = state.turnos.filter(function(t){ return t.id!==id; });
      saveTurnos();
      state.propietarios.forEach(function(p){ if(p.turnoId===id) p.turnoId=''; });
      saveProp();
      renderDatos();
    });
  });
  document.getElementById('btnExportJson').addEventListener('click', function(){
    downloadFile('respaldo_vehiculos_'+todayISO()+'.json', 'application/json', JSON.stringify({propietarios:state.propietarios, vehiculos:state.vehiculos, movimientos:state.movimientos, turnos:state.turnos, config:getConfig()}, null, 2));
    document.getElementById('exportMsg').textContent = 'Respaldo descargado.';
  });
  document.getElementById('fileInput').addEventListener('change', function(ev){
    var file = ev.target.files[0]; if(!file) return;
    var msg = document.getElementById('importMsg');
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(Array.isArray(data.propietarios)){ state.propietarios = mergeById(state.propietarios, data.propietarios); saveProp(); }
        if(Array.isArray(data.vehiculos)){ state.vehiculos = mergeById(state.vehiculos, data.vehiculos); saveVeh(); }
        if(Array.isArray(data.movimientos)){ state.movimientos = mergeById(state.movimientos, data.movimientos); saveMov(); }
        if(Array.isArray(data.turnos)){ state.turnos = mergeById(state.turnos, data.turnos); saveTurnos(); }
        if(data.config && typeof data.config==='object'){ setConfig(data.config); }
        renderDatos();
        msg = document.getElementById('importMsg');
        if(msg){ msg.textContent = 'Respaldo importado correctamente.'; msg.style.color='var(--good)'; }
      }catch(err){ msg.textContent = 'No se pudo leer el archivo.'; msg.style.color='var(--danger)'; }
    };
    reader.readAsText(file, 'UTF-8');
  });
  document.getElementById('btnCambiarPin').addEventListener('click', function(){
    if(getAdminPin()){ openPinModal('Ingresa el PIN actual para cambiarlo.', function(){ openCreatePinModal('Escribe el nuevo PIN.', function(){ renderDatos(); }); }); }
    else { openCreatePinModal('Se pedirá para entrar a modo administrador.', function(){ renderDatos(); }); }
  });
  var btnQuitarPin = document.getElementById('btnQuitarPin');
  if(btnQuitarPin) btnQuitarPin.addEventListener('click', function(){
    openPinModal('Ingresa el PIN actual para quitarlo.', function(){ clearAdminPin(); renderDatos(); });
  });
  document.getElementById('btnWipeMov').addEventListener('click', function(){
    if(!confirm('¿Eliminar los '+state.movimientos.length+' movimiento(s)? No se puede deshacer.')) return;
    localStorage.removeItem(LS_MOV); loadAll(); renderDatos();
  });
  document.getElementById('btnWipeVeh').addEventListener('click', function(){
    if(!confirm('¿Eliminar los '+state.vehiculos.length+' vehículo(s)? No se puede deshacer.')) return;
    localStorage.removeItem(LS_VEH); loadAll(); renderDatos();
  });
  document.getElementById('btnWipeProp').addEventListener('click', function(){
    if(!confirm('¿Eliminar los '+state.propietarios.length+' propietario(s)? No se puede deshacer.')) return;
    localStorage.removeItem(LS_PROP); loadAll(); renderDatos();
  });
  document.getElementById('btnWipeAll').addEventListener('click', function(){
    openPinModal('Esto eliminará permanentemente todos los datos. Ingresa el PIN administrativo.', function(){
      [LS_PROP, LS_VEH, LS_MOV, LS_COUNTER].forEach(function(k){ localStorage.removeItem(k); });
      loadAll(); renderDatos();
    });
  });
}
function riskCard(title, countText, btnId){
  return '<div class="card" style="padding:16px 18px; display:flex; flex-direction:column; gap:10px;">'+
    '<div><div style="font-weight:600; font-size:13.5px;">'+title+'</div><div style="color:var(--text-muted); font-size:12.5px;">'+countText+'</div></div>'+
    '<button class="btn" id="'+btnId+'" style="border-color:var(--danger-bg); color:var(--danger); align-self:flex-start;">Borrar</button>'+
  '</div>';
}

/* ---------- init ---------- */
loadAll();
applyAdminVisibility();
var startView = (location.hash||'').replace('#','');
if(!VIEWS[startView]) startView = 'dashboard';
if(startView==='datos' && !isAdmin()) startView = 'dashboard';
go(startView);

})();
</script>
